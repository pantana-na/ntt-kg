[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ntt-kg-demo"
version = "1.0.0"
description = "Spanner Hybrid Search + Property Graph & Dataplex Knowledge Catalog Demo for OKF Plant Knowledge"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "google-cloud-spanner>=3.49.0",
  "google-cloud-dataplex>=2.6.0",
  "google-cloud-storage>=2.18.0",
  "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "hypothesis>=6.112.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
